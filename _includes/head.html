<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link
  href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml"
  rel="alternate"
  title="{{ site.title }} Feed">
{% endunless %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff" id="theme-color">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

<script>
  document.documentElement.className =
    document.documentElement.className.replace(/\bno-js\b/g, "") + " js";
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" id="theme-source">

{% if site.minimal_mistakes_skin2 %}
<link
  rel="stylesheet alternate"
  href="{{ '/assets/css/theme2.css' | relative_url }}"
  id="theme-source-dark">

<script>
(function () {
  "use strict";

  const lightStylesheet = document.getElementById("theme-source");
  const darkStylesheet = document.getElementById("theme-source-dark");
  const themeColor = document.getElementById("theme-color");
  let storedTheme = null;
  try {
    storedTheme = localStorage.getItem("site-theme");
  } catch (error) {
    storedTheme = null;
  }
  const systemPrefersDark =
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let currentTheme = storedTheme || (systemPrefersDark ? "dark" : "light");

  function applyTheme(theme) {
    currentTheme = theme === "dark" ? "dark" : "light";
    lightStylesheet.rel = currentTheme === "light" ? "stylesheet" : "stylesheet alternate";
    darkStylesheet.rel = currentTheme === "dark" ? "stylesheet" : "stylesheet alternate";
    document.documentElement.dataset.theme = currentTheme;
    if (themeColor) themeColor.content = currentTheme === "dark" ? "#252a34" : "#ffffff";
    document.querySelectorAll("[data-theme-toggle]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(currentTheme === "dark"));
      button.setAttribute(
        "aria-label",
        currentTheme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
      button.title =
        currentTheme === "dark" ? "Switch to light theme" : "Switch to dark theme";
    });
  }

  window.MarvinFritzTheme = {
    toggle: function () {
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      try {
        localStorage.setItem("site-theme", nextTheme);
      } catch (error) {
        // The theme still changes for this page when storage is unavailable.
      }
      applyTheme(nextTheme);
    }
  };

  applyTheme(currentTheme);

  document.addEventListener("DOMContentLoaded", function () {
    applyTheme(currentTheme);
    document.querySelectorAll("[data-theme-toggle]").forEach(function (button) {
      button.addEventListener("click", window.MarvinFritzTheme.toggle);
    });
  });
}());
</script>
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}">
<link
  rel="preload"
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
</noscript>

{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    }
  };
</script>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
{% endif %}

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
