remote_theme: "mmistakes/minimal-mistakes@4.25.0"
minimal_mistakes_skin: "default"
minimal_mistakes_skin2: "dark"

locale: "en-US"
title: "Marvin Fritz"
title_separator: "–"
subtitle: "Numerical Analysis"
name: "Marvin Fritz"
description: >-
  Marvin Fritz is a tenure-track Professor at the University of Vienna working on
  numerical analysis of partial differential equations, structure-preserving methods,
  fractional equations, control, and mathematical models in the life sciences.
url: "https://www.marvinfritz.de"
baseurl: ""
repository: "fritz-io/fritz-io.github.io"
masthead_title: "Marvin Fritz"
teaser: "/assets/images/research.webp"
og_image: "/assets/images/research.webp"
og_image_alt: "Research illustration for the academic website of Marvin Fritz"
logo:
breadcrumbs: false
words_per_minute: 200
search: false
timezone: "Europe/Vienna"

atom_feed:
  hide: true

social:
  type: "Person"
  name: "Marvin Fritz"
  links:
    - "https://orcid.org/0000-0002-8360-7371"
    - "https://scholar.google.com/citations?user=UXscgtgAAAAJ"
    - "https://arxiv.org/a/fritz_m_1"
    - "https://www.researchgate.net/profile/Marvin-Fritz"

author:
  name: "Marvin Fritz"
  avatar: "/assets/images/E4EFF94B-D03E-410E-AE60-744F714BC731.png"
  bio: "Tenure-track Professor of Numerical Analysis at the University of Vienna"
  location: "Vienna, Austria"
  email: "marvin.fritz@univie.ac.at"
  links:
    - label: "University profile"
      icon: "fas fa-fw fa-building-columns"
      url: "https://mathematik.univie.ac.at/en/about-us/staff/?api_lang=en&api_pkey=1021846&api_task=member_details"

footer:
  since: "2023"
  links:
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-8360-7371"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=UXscgtgAAAAJ"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/fritz-io"

include:
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - .lychee.toml
  - .pa11yci.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive
      author_profile: true
      classes: wide
      sitemap: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
